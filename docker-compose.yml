services:
  badmintonnet-ai:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - hf_token
    image: dann224/badmintonnet-ai:latest
    container_name: badmintonnet-ai
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS}
      GROQ_MAX_RETRIES: ${GROQ_MAX_RETRIES}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS}

      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY}
      RATE_LIMIT_COOLDOWN_SECONDS: ${RATE_LIMIT_COOLDOWN_SECONDS}

      MCP_BASE_URL: ${MCP_BASE_URL}

      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-true}
      HF_HOME: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/huggingface

      SESSION_MEMORY_STORE_PATH: /app/session_memory_store
      SESSION_MEMORY_RETRIEVE_K: ${SESSION_MEMORY_RETRIEVE_K}
    volumes:
      - session_memory_store:/app/session_memory_store

volumes:
  session_memory_store:

secrets:
  hf_token:
    environment: HF_TOKEN

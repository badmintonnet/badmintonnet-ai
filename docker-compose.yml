services:
  badmintonnet-ai:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - hf_token
    image: dann224/badmintonnet-ai:latest
    container_name: badmintonnet-ai
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_MODEL_FAST: ${OPENAI_MODEL_FAST:-gpt-5.4-mini}
      OPENAI_MODEL_RECOVERY: ${OPENAI_MODEL_RECOVERY:-gpt-5.4}
      OPENAI_MODEL_TITLE: ${OPENAI_MODEL_TITLE:-gpt-5.4-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-900}
      OPENAI_RECOVERY_MAX_TOKENS: ${OPENAI_RECOVERY_MAX_TOKENS:-1100}
      OPENAI_TITLE_MAX_TOKENS: ${OPENAI_TITLE_MAX_TOKENS:-120}
      OPENAI_REQUESTS_PER_SECOND: ${OPENAI_REQUESTS_PER_SECOND:-0.2}
      OPENAI_RATE_CHECK_SECONDS: ${OPENAI_RATE_CHECK_SECONDS:-0.25}

      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-90}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-8}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      RATE_LIMIT_COOLDOWN_SECONDS: ${RATE_LIMIT_COOLDOWN_SECONDS:-35}
      MEMORY_CONTEXT_CHAR_LIMIT: ${MEMORY_CONTEXT_CHAR_LIMIT:-900}
      RAG_CONTEXT_CHAR_LIMIT: ${RAG_CONTEXT_CHAR_LIMIT:-1200}
      CHAT_INPUT_CHAR_LIMIT: ${CHAT_INPUT_CHAR_LIMIT:-2800}
      RECOVERY_TRANSCRIPT_CHAR_LIMIT: ${RECOVERY_TRANSCRIPT_CHAR_LIMIT:-3000}

      MCP_BASE_URL: ${MCP_BASE_URL}

      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-true}
      HF_HOME: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/huggingface

      SESSION_MEMORY_STORE_PATH: /app/session_memory_store
      SESSION_MEMORY_RETRIEVE_K: ${SESSION_MEMORY_RETRIEVE_K:-2}
    volumes:
      - session_memory_store:/app/session_memory_store

volumes:
  session_memory_store:

secrets:
  hf_token:
    environment: HF_TOKEN
